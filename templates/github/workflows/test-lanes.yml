# Build Autopilot: the `wave` test lane (tests.lane: wave).
#
# While nothing is live, a pull request does not wait for the whole suite. It waits for the quick tests, and the
# full suite runs on main in batches:
#
#   - pull_request: the quick tests only. The job is named `test`, so a branch rule that requires `test` still works.
#     The job's first step, `What changed`, works out the change type (.github/autopilot/lanes.py, docs/policy.md
#     "Change types"): a policy-only or CI-only change runs no tests, and with `tests.suites` set a job that passes
#     `--suite <name>` runs only when that suite is touched. Every later step carries
#     `if: steps.what.outputs.run != 'false'`, so the tests skip only on an explicit answer. Copy the checkout depth,
#     the step and that `if:` into every job that runs tests on pull requests.
#     The decision is a step, not a separate job, on purpose: GitHub creates a job's check only once the jobs it
#     `needs` have finished, so a job that waits leaves an older result on the same commit as the newest one. A step
#     makes the check pending as soon as the run exists. That matters when a parked draft (`tests.drafts: skip`) is
#     marked ready, and whenever a run is repeated on the same commit.
#   - push to main: the full suite. The `full` job's concurrency group never cancels a run in progress, and GitHub
#     keeps at most one run waiting behind it and replaces an older waiting run with the newest. So one run is going
#     and the newest push is waiting: each run covers whatever merged while the one before it ran. There is no
#     batch size to set; the batch sizes itself to how long the suite takes.
#   - workflow_dispatch: the full suite on demand, for the end of a wave ("Run workflow" on the Actions tab, or
#     `gh workflow run test-lanes.yml`).
#
# A red `full` run on main means fix main before landing more. There is no automatic undo in this lane.
#
# Copy this file to .github/workflows/, and set the two commands below. If the repo already has a test workflow, merge
# these triggers and the two concurrency groups into it instead of adding a second workflow that runs the same tests.
#
# Runner: every job runs on `vars.CI_RUNNER`, the org's general self-hosted CI pool (SConsInc: shorconsulting-ci), not
# the gate's autopilot pool: that pool only takes the gate workflow on the default branch, and these jobs run the pull
# request's code. A public repo sets a repo variable CI_RUNNER to a GitHub-hosted label (ubuntu-latest) instead, so a
# fork's pull request never runs on a self-hosted machine.
#
# Does not need the gate. Use `tests.suites` in .github/autopilot.json for per-suite path rules; see docs/policy.md.

name: test-lanes
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]   # ready_for_review: a parked draft starts here
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUICK_TESTS: npm run test:quick    # what a pull request must pass: fast, covers the files the change touches
  FULL_TESTS: npm test               # everything

jobs:
  test:
    name: test
    if: github.event_name == 'pull_request'
    # A pull request labelled `ci-priority` asks for the priority runner, which scripts/priority_runner.py makes
    # out of the pool's next free slot (docs/policy.md, "Priority runs"). Every other one waits in the pool's queue.
    runs-on: ${{ contains(github.event.pull_request.labels.*.name, 'ci-priority') && 'ci-priority' || vars.CI_RUNNER }}
    timeout-minutes: 20
    concurrency:
      group: quick-${{ github.event.pull_request.number }}
      cancel-in-progress: true       # a newer push to the same pull request makes the older run worthless
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2             # the merge commit and its parents: HEAD^1 is the base branch as GitHub merged it
      - name: What changed
        id: what
        env:
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The rules and the settings are read from the base branch (HEAD^1), so a pull request cannot reclassify
          # itself. If either is missing there, or anything fails, the tests run. So do they for a pull request into
          # any other branch: its result stays on the commit if it is later pointed at the default branch, and a diff
          # against another branch hides that branch's own changes.
          if [ "$BASE_REF" = "$DEFAULT" ] &&
             files=$(git diff --no-renames --name-only HEAD^1 HEAD) &&
             git show HEAD^1:.github/autopilot/lanes.py > "$RUNNER_TEMP/lanes.py" 2>/dev/null &&
             git show HEAD^1:.github/autopilot.json > "$RUNNER_TEMP/policy.json" 2>/dev/null &&
             python3 "$RUNNER_TEMP/lanes.py" classify "$RUNNER_TEMP/policy.json" --draft "$DRAFT" <<<"$files" > "$RUNNER_TEMP/out"; then
            tee -a "$GITHUB_OUTPUT" < "$RUNNER_TEMP/out" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" | tee -a "$GITHUB_OUTPUT"
          fi
      - if: steps.what.outputs.run != 'false'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.what.outputs.run != 'false'
        run: npm ci
      - if: steps.what.outputs.run != 'false'
        run: ${{ env.QUICK_TESTS }}

  full:
    name: full suite
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 60
    concurrency:
      group: full-suite-main
      cancel-in-progress: false      # never cancel the run in progress; the newest waiting run replaces older waiting ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ${{ env.FULL_TESTS }}
      - name: Say what this run covered
        if: always()
        run: |
          echo "### Full suite on \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Covers every change merged to main since the previous full run started." >> "$GITHUB_STEP_SUMMARY"
