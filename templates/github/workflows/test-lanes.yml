# Build Autopilot: the `wave` test lane (tests.lane: wave).
#
# While nothing is live, a pull request does not wait for the whole suite. It waits for the quick tests, and the
# full suite runs on main in batches:
#
#   - pull_request: the quick tests only. The job is named `test`, so a branch rule that requires `test` still works.
#     The `changes` job first works out the change type (.github/autopilot/lanes.py, docs/policy.md "Change types"):
#     a policy-only or CI-only change runs no tests, a draft runs nothing until it is marked ready when
#     `tests.drafts` is `skip` (off by default; see docs/policy.md), and with
#     `tests.suites` set a job runs only when its suite is touched. Copy the `changes` job and the `if:` on `test`
#     into every workflow that runs tests on pull requests. A job that runs only one suite adds
#     `&& (needs.changes.outputs.class != 'light' || contains(needs.changes.outputs.suites, '"<suite>"'))`.
#     Both skip only on an explicit answer: a missing or failed `changes` runs the tests.
#   - push to main: the full suite. The `full` job's concurrency group never cancels a run in progress, and GitHub
#     keeps at most one run waiting behind it and replaces an older waiting run with the newest. So one run is going
#     and the newest push is waiting: each run covers whatever merged while the one before it ran. There is no
#     batch size to set; the batch sizes itself to how long the suite takes.
#   - workflow_dispatch: the full suite on demand, for the end of a wave ("Run workflow" on the Actions tab, or
#     `gh workflow run test-lanes.yml`).
#
# A red `full` run on main means fix main before landing more. There is no automatic undo in this lane.
#
# Copy this file to .github/workflows/, and set the two commands below. If the repo already has a test workflow, merge
# these triggers and the two concurrency groups into it instead of adding a second workflow that runs the same tests.
#
# Runner: every job runs on `vars.AUTOPILOT_RUNNER`, like the gate (docs/v2-install.md, "The runner"): the org's
# self-hosted autopilot pool for a private repo, a repo variable set to a GitHub-hosted label for a public one. If the
# repo's tests need more than that pool gives (it has no sudo or docker), point these jobs at the repo's own runner.
#
# Does not need the gate. Use `tests.suites` in .github/autopilot.json for per-suite path rules; see docs/policy.md.

name: test-lanes
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]   # ready_for_review: a parked draft starts here
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QUICK_TESTS: npm run test:quick    # what a pull request must pass: fast, covers the files the change touches
  FULL_TESTS: npm test               # everything

jobs:
  changes:
    name: what changed
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.AUTOPILOT_RUNNER }}
    timeout-minutes: 5
    outputs:
      class: ${{ steps.classify.outputs.class }}
      skip: ${{ steps.classify.outputs.skip }}
      suites: ${{ steps.classify.outputs.suites }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # The rules and the settings are read from the base branch, so a pull request cannot reclassify itself.
          # If either is missing there, or anything fails, everything runs. So does a pull request into any other
          # branch: its result stays on the commit if it is later pointed at the default branch, and a diff against
          # another branch hides that branch's own changes.
          if [ "$BASE_REF" = "$DEFAULT" ] &&
             git show "$BASE:.github/autopilot/lanes.py" > "$RUNNER_TEMP/lanes.py" 2>/dev/null &&
             git show "$BASE:.github/autopilot.json" > "$RUNNER_TEMP/policy.json" 2>/dev/null &&
             git diff --no-renames --name-only "$BASE"...HEAD |
               python3 "$RUNNER_TEMP/lanes.py" classify "$RUNNER_TEMP/policy.json" --draft "$DRAFT" > "$RUNNER_TEMP/out"; then
            cat "$RUNNER_TEMP/out" | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'class=normal\nskip=false\nsuites=[]\n' | tee -a "$GITHUB_OUTPUT"
          fi

  test:
    name: test
    needs: changes
    # A skipped job still satisfies a rule that requires `test`. For a matrix job, skip step by step instead.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && (needs.changes.result != 'success' || needs.changes.outputs.skip != 'true') }}
    runs-on: ${{ vars.AUTOPILOT_RUNNER }}
    timeout-minutes: 20
    concurrency:
      group: quick-${{ github.event.pull_request.number }}
      cancel-in-progress: true       # a newer push to the same pull request makes the older run worthless
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ${{ env.QUICK_TESTS }}

  full:
    name: full suite
    if: github.event_name != 'pull_request'
    runs-on: ${{ vars.AUTOPILOT_RUNNER }}
    timeout-minutes: 60
    concurrency:
      group: full-suite-main
      cancel-in-progress: false      # never cancel the run in progress; the newest waiting run replaces older waiting ones
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: ${{ env.FULL_TESTS }}
      - name: Say what this run covered
        if: always()
        run: |
          echo "### Full suite on \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Covers every change merged to main since the previous full run started." >> "$GITHUB_STEP_SUMMARY"
